plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = "1.4.0+mc1.20.1"
group = 'com.example'

base {
    archivesName = "throwallmoveall-mc1.20.1"
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.fabricmc.net/') }
    maven { url = uri('https://maven.terraformersmc.com/releases/') }
}

sourceSets {
    main {
        java {
            srcDirs = [
                rootProject.file('common/src/main/java'),
                rootProject.file('versions/1.20/src/main/java')
            ]
            exclude { element ->
                element.file == rootProject.file('common/src/main/java/com/example/throwallmoveall/client/ModConfigScreen.java')
            }
        }
        resources {
            srcDirs = [
                rootProject.file('common/src/main/resources'),
                'src/main/resources'
            ]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.7"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1"
    modCompileOnly "com.terraformersmc:modmenu:7.2.2"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveBaseName = "throwallmoveall"
    archiveVersion  = "1.4.0+mc1.20.1"
}