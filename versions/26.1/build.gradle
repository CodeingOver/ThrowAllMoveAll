plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = "1.5.1-mc26.1"
group = 'com.example'

base {
    archivesName = "throwallmoveall"
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.fabricmc.net/') }
    maven { url = uri('https://maven.terraformersmc.com/releases/') }
}

sourceSets {
    main {
        java {
            srcDirs = [rootProject.file('common/src/main/java')]
        }
        resources {
            srcDirs = [
                rootProject.file('common/src/main/resources'),
                'src/main/resources'
            ]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.5"
    mappings "net.fabricmc:yarn:1.21.5+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.119.5+1.21.5"
    modCompileOnly "com.terraformersmc:modmenu:14.0.0"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('runClient', JavaExec).configure {
    def jdk21 = file('C:/Program Files/Java/jdk-21.0.11/bin/java.exe')
    if (jdk21.exists()) {
        executable = jdk21
    }
}