plugins {
    id 'java'
    id 'maven-publish'
}

version = "1.5.2-mc26.1"
group = 'com.example'

base {
    archivesName = "throwallmoveall"
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.fabricmc.net/') }
    maven { url = uri('https://maven.terraformersmc.com/releases/') }
    maven { url = uri('https://libraries.minecraft.net/') }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = [
                rootProject.file('common/src/main/resources'),
                'src/main/resources'
            ]
        }
    }
}

dependencies {
    compileOnly files("C:/Users/Admin/AppData/Roaming/PrismLauncher/libraries/com/mojang/minecraft/26.1/minecraft-26.1-client.jar")
    compileOnly "net.fabricmc:fabric-loader:0.16.10"
    compileOnly "net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2"
    compileOnly "com.terraformersmc:modmenu:18.0.0"
    compileOnly "org.lwjgl:lwjgl:3.4.1"
    compileOnly "org.lwjgl:lwjgl-glfw:3.4.1"
    compileOnly "org.slf4j:slf4j-api:2.0.17"
    compileOnly "org.jspecify:jspecify:1.0.0"
    compileOnly "com.mojang:brigadier:1.3.10"
    compileOnly "it.unimi.dsi:fastutil:8.5.18"
    compileOnly "com.google.code.gson:gson:2.13.2"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
