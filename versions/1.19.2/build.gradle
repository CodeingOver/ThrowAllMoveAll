plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = "1.5.0+mc1.19.2"
group = 'com.example'

base {
    archivesName = "throwallmoveall-mc1.19.2"
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.fabricmc.net/') }
    maven { url = uri('https://maven.terraformersmc.com/releases/') }
}

sourceSets {
    main {
        java {
            srcDirs = [
                rootProject.file('common/src/main/java'),
                'src/main/java'
            ]
            exclude { element ->
                element.file == rootProject.file('common/src/main/java/com/example/throwallmoveall/client/ModConfigScreen.java')
            }
        }
        resources {
            srcDirs = [
                rootProject.file('common/src/main/resources'),
                'src/main/resources'
            ]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.19.2"
    mappings "net.fabricmc:yarn:1.19.2+build.28:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.77.0+1.19.2"
    modCompileOnly "com.terraformersmc:modmenu:4.0.4"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveBaseName = "throwallmoveall"
    archiveVersion  = "1.4.0+mc1.19.2"
}

tasks.named('runClient', JavaExec).configure {
    def jdk21 = file('C:/Program Files/Java/jdk-21.0.11/bin/java.exe')
    if (jdk21.exists()) {
        executable = jdk21
    }
}