plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = "1.6.0-mc1.20.2"
group = 'com.example'

base {
    archivesName = "throwallmoveall"
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.fabricmc.net/') }
    maven { url = uri('https://maven.terraformersmc.com/releases/') }
}

sourceSets {
    main {
        java {
            srcDirs = [rootProject.file('common/src/main/java')]
        }
        resources {
            srcDirs = [
                rootProject.file('common/src/main/resources'),
                'src/main/resources'
            ]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.2"
    mappings "net.fabricmc:yarn:1.20.2+build.4:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.91.1+1.20.2"
    modCompileOnly "com.terraformersmc:modmenu:8.0.1"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named('runClient', JavaExec).configure {
    def jdk21 = file('C:/Program Files/Java/jdk-21.0.11/bin/java.exe')
    if (jdk21.exists()) {
        executable = jdk21
    }
}