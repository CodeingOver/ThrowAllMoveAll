plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = "1.4.0+mc1.20.4"
group = 'com.example'

base {
    archivesName = "throwallmoveall-mc1.20.4"
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.fabricmc.net/') }
    maven { url = uri('https://maven.terraformersmc.com/releases/') }
}

sourceSets {
    main {
        java {
            srcDirs = [rootProject.file('common/src/main/java')]
        }
        resources {
            srcDirs = [
                rootProject.file('common/src/main/resources'),
                'src/main/resources'
            ]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.4"
    mappings "net.fabricmc:yarn:1.20.4+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.7"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.0+1.20.4"
    modCompileOnly "com.terraformersmc:modmenu:9.0.0"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    archiveBaseName = "throwallmoveall"
    archiveVersion  = "1.4.0+mc1.20.4"
}