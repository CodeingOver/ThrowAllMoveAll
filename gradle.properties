# ═══════════════════════════════════════════════════════════════════════════
#  ThrowAll & MoveAll — Gradle Properties
#  Multi-version build system
#
#  USAGE:
#    Default (1.20.4):
#        ./gradlew build
#
#    Specific version:
#        ./gradlew build -PmcVersion=1.21.4
#        ./gradlew build -PmcVersion=26.2
#
#  Available mcVersion values:
#    Era 1 (Java 17): 1.19  1.19.2  1.19.4  1.20  1.20.1  1.20.2  1.20.4
#    Era 2 (Java 21): 1.20.6  1.21  1.21.1  1.21.4  1.21.5  1.21.6  1.21.7  1.21.8  1.21.9  1.21.10  1.21.11
#    Era 3 (Java 25): 26.1  26.2
# ═══════════════════════════════════════════════════════════════════════════

# Gradle JVM settings
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ── Default version (can be overridden with -PmcVersion=X.X.X) ──────────────
# Default: Minecraft 1.20.4 (current stable base)
minecraft_version=1.20.4
yarn_mappings=1.20.4+build.3
loader_version=0.15.7
fabric_version=0.97.0+1.20.4

# Mod Properties (these never change across versions)
mod_id=throwallmoveall
mod_version=1.6.0
maven_group=com.example
