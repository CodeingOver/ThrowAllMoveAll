// ═══════════════════════════════════════════════════════════════════════════
//  ThrowAll & MoveAll — Root Multi-Project Gradle Build
//
//  Subprojects:
//    - versions:1.19    .. versions:1.19.4   (Era 1 - Java 17, Legacy Screen API)
//    - versions:1.20    .. versions:1.20.4   (Era 1 - Java 17, DrawContext)
//    - versions:1.20.6  .. versions:1.21.5   (Era 2 - Java 21, Loom 1.10)
//    - versions:26.1    .. versions:26.2     (Era 3 - Java 25 / 21 baseline, Loom 1.10)
// ═══════════════════════════════════════════════════════════════════════════

plugins {
    id "com.modrinth.minotaur" version "2.8.7" apply false
}

def versionList = [
    '1.19', '1.19.2', '1.19.4',
    '1.20', '1.20.1', '1.20.2', '1.20.4',
    '1.20.6', '1.21', '1.21.1', '1.21.4', '1.21.5',
    '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11'
    // '26.1', '26.2' // Tạm dừng cho đến khi Mojang/Fabric phát hành artifact Maven chính thức
]

// Exclude unstable 26.1 and 26.2 from Modrinth publication
def modrinthPublishVersions = [
    '1.19', '1.19.2', '1.19.4',
    '1.20', '1.20.1', '1.20.2', '1.20.4',
    '1.20.6', '1.21', '1.21.1', '1.21.4', '1.21.5',
    '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11'
]

def getEnvToken() {
    def envToken = System.getenv("MODRINTH_TOKEN")
    if (envToken) return envToken

    def envFile = rootProject.file(".env")
    if (envFile.exists()) {
        envFile.eachLine { line ->
            line = line.trim()
            if (line.startsWith("MODRINTH_TOKEN=") && !line.startsWith("#")) {
                envToken = line.substring("MODRINTH_TOKEN=".length()).trim()
            }
        }
    }
    return envToken ?: findProperty("modrinthToken") ?: ""
}

subprojects {
    afterEvaluate {
        tasks.withType(JavaExec).matching { it.name == 'runClient' }.configureEach {
            def jdk21 = file('C:/Program Files/Java/jdk-21.0.11/bin/java.exe')
            if (jdk21.exists()) {
                executable = jdk21
            }
        }
    }
}

modrinthPublishVersions.each { ver ->
    project(":versions:${ver}") {
        apply plugin: 'com.modrinth.minotaur'

        afterEvaluate {
            modrinth {
                token = getEnvToken()
                projectId = "throwall-moveall"
                versionNumber = "1.6.0-mc" + project.name
                versionName = "ThrowAll & MoveAll 1.6.0 (Minecraft " + project.name + ")"
                versionType = "release"
                uploadFile = tasks.named('remapJar')
                gameVersions = [project.name]
                loaders = ["fabric"]
                changelog = """- Added full support for Minecraft 1.21.6 through 1.21.11.
- Standardized multi-project build toolchain on Fabric Loom 1.14."""
            }
        }
    }
}

task collectJars {
    group = 'build'
    description = 'Collects output JAR files from all version subprojects into dist/'

    mustRunAfter versionList.collect { ":versions:${it}:build" }
    mustRunAfter versionList.collect { ":versions:${it}:remapJar" }

    doLast {
        versionList.each { ver ->
            def subProject = project(":versions:${ver}")
            def jarDir = file("versions/${ver}/build/libs")
            if (jarDir.exists()) {
                copy {
                    into file('dist')
                    from(jarDir) {
                        include "${subProject.base.archivesName.get()}-${subProject.version}.jar"
                    }
                }
            }
        }
    }
}

task buildAll {
    group = 'build'
    description = 'Builds all version subprojects natively and collects JARs into dist/'

    versionList.each { ver ->
        dependsOn ":versions:${ver}:build"
    }

    doLast {
        println "\n=================================================="
        println "  ThrowAll & MoveAll - Collecting output JARs"
        println "==================================================\n"

        delete file('dist')

        versionList.each { ver ->
            def subProject = project(":versions:${ver}")
            def jarDir = file("versions/${ver}/build/libs")
            if (jarDir.exists()) {
                copy {
                    into file('dist')
                    from(jarDir) {
                        include "${subProject.base.archivesName.get()}-${subProject.version}.jar"
                    }
                }
            }
        }

        def distFiles = file('dist').listFiles()?.findAll { it.name.endsWith('.jar') } ?: []
        println "SUCCESS! Collected ${distFiles.size()} JAR file(s) into dist/:"
        distFiles.each { println "  - ${it.name}" }
        println "==================================================\n"
    }
}

task publishAllModrinth {
    group = 'publishing'
    description = 'Publishes 12 stable version JARs (1.19 to 1.21.5) directly to Modrinth via Minotaur plugin'

    modrinthPublishVersions.each { ver ->
        dependsOn ":versions:${ver}:modrinth"
    }
}
